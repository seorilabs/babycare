name: Build Mini-app Candidate

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "빌드할 SemVer 태그. 비우면 호출 ref"
        type: string
        required: false
        default: ""

permissions:
  contents: read
  packages: read

concurrency:
  group: babycare-mini-app-build-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    name: Build .ait artifact
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0
          check-latest: false
          registry-url: https://npm.pkg.github.com
          scope: '@seorilabs'

      - name: Enable pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.14.0 --activate

      - name: Install dependencies
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: pnpm install --frozen-lockfile

      - name: Build .ait bundle
        shell: bash
        env:
          APP_VERSION: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          pnpm --dir apps/ait build
          test -f apps/ait/babynest.ait

      - name: Upload .ait artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mini-app-candidate-babycare-${{ inputs.release_tag || github.ref_name }}-${{ github.sha }}
          path: apps/ait/babynest.ait
          if-no-files-found: error
          retention-days: 3

      - name: Summary
        shell: bash
        run: |
          {
            echo "### AppsInToss candidate"
            echo "- source: $GITHUB_SHA"
            echo "- artifact: apps/ait/babynest.ait"
            echo "- deployment: not requested"
          } >> "$GITHUB_STEP_SUMMARY"
