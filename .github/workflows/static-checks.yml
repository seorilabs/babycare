# main 정적 품질 게이트 — org 재사용 워크플로우 호출.
# 무거운 빌드/배포 금지(태그/배포는 deploy-*.yml). 설계: seorilabs/.github docs/ci-cd.
name: Static Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: static-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: seorilabs/.github/.github/workflows/rn-static-checks.yml@8a11a145fed35479a4a89ebc7ca97edd0a0f05fd
    with:
      runs_on: ${{ github.event.repository.private && 'seorilabs-rpi-arm64' || 'ubuntu-latest' }}
      package_manager: pnpm
      npm_registry_url: https://npm.pkg.github.com
      npm_scope: '@seorilabs'
      install_command: "pnpm install --ignore-scripts --frozen-lockfile=false"
      check_command: |
        pnpm run test:static

  firebase-emulator:
    name: Firebase emulator
    runs-on: ${{ github.event.repository.private && 'seorilabs-rpi-arm64' || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          check-latest: false
          registry-url: https://npm.pkg.github.com
          scope: '@seorilabs'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Enable pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.12.0 --activate

      - name: Install dependencies
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: pnpm install --ignore-scripts --frozen-lockfile=false

      - name: Run Firebase emulator tests
        shell: bash
        run: |
          set -euo pipefail
          pnpm run test:firebase
          pnpm run test:functions:emulator
