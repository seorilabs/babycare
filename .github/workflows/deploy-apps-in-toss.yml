# AIT(.ait) 빌드 + AppsInToss 비공개 업로드.
# Granite Linux Hermes compiler가 x86-64 전용이므로 ubuntu x64에서 실행한다.
name: Deploy AppsInToss

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "업로드할 릴리즈 태그. 비우면 호출 ref."
        type: string
        required: false
        default: ""
      memo:
        description: "업로드 메모(선택)"
        type: string
        required: false
        default: ""
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: false
        default: ""
      memo:
        type: string
        required: false
        default: ""
    secrets:
      APPS_IN_TOSS_API_KEY:
        required: true
      FIREBASE_WEB_API_KEY:
        required: true

permissions:
  contents: read
  packages: read

concurrency:
  group: babycare-apps-in-toss-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and upload .ait
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: apps-in-toss

    env:
      APPS_IN_TOSS_API_KEY: ${{ secrets.APPS_IN_TOSS_API_KEY }}
      FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
      AIT_REWARDED_AD_GROUP_ID: ${{ vars.AIT_REWARDED_AD_GROUP_ID }}
      RELEASE_REF: ${{ inputs.release_tag }}
      INPUT_MEMO: ${{ inputs.memo }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Validate AppsInToss and Firebase secrets
        shell: bash
        run: |
          set -euo pipefail
          [ -n "$APPS_IN_TOSS_API_KEY" ] || {
            echo "APPS_IN_TOSS_API_KEY secret is required." >&2
            exit 1
          }
          [ -n "$FIREBASE_WEB_API_KEY" ] || {
            echo "FIREBASE_WEB_API_KEY secret is required." >&2
            exit 1
          }
          [ -n "$AIT_REWARDED_AD_GROUP_ID" ] || {
            echo "AIT_REWARDED_AD_GROUP_ID variable is required." >&2
            exit 1
          }

      - name: Resolve upload ref
        id: ref
        shell: bash
        run: |
          set -euo pipefail
          ref="$RELEASE_REF"
          [ -n "$ref" ] || ref="${GITHUB_REF_NAME:-$(git rev-parse --abbrev-ref HEAD)}"
          {
            echo "ref=$ref"
            echo "short_sha=$(git rev-parse --short HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0
          check-latest: false
          registry-url: https://npm.pkg.github.com
          scope: '@seorilabs'

      - name: Enable pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.14.0 --activate

      - name: Install dependencies
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: pnpm install --frozen-lockfile

      - name: Build .ait bundle
        shell: bash
        env:
          APP_VERSION: ${{ steps.ref.outputs.ref }}
        run: |
          set -euo pipefail
          pnpm --dir apps/ait build
          test -f apps/ait/babynest.ait

      - name: Upload .ait artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ait-babycare-${{ steps.ref.outputs.ref }}-${{ steps.ref.outputs.short_sha }}
          path: apps/ait/babynest.ait
          if-no-files-found: error
          retention-days: 3

      - name: Upload to AppsInToss
        shell: bash
        env:
          DEPLOY_REF: ${{ steps.ref.outputs.ref }}
          DEPLOY_SHORT_SHA: ${{ steps.ref.outputs.short_sha }}
        run: |
          set -euo pipefail
          memo="$INPUT_MEMO"
          if [ -z "$memo" ]; then
            memo="GitHub Actions ${DEPLOY_REF}@${DEPLOY_SHORT_SHA}"
          else
            memo="${DEPLOY_REF} · ${memo}"
          fi

          pnpm --dir apps/ait exec ait deploy \
            --api-key "$APPS_IN_TOSS_API_KEY" \
            --location ./babynest.ait \
            --memo "$memo" \
            --timeout 300

      - name: Summary
        shell: bash
        env:
          DEPLOY_REF: ${{ steps.ref.outputs.ref }}
        run: |
          {
            echo "### AppsInToss build upload"
            echo ""
            echo "- ref: $DEPLOY_REF"
            echo "- runner: ubuntu-latest x64"
            echo "- artifact: apps/ait/babynest.ait"
            echo "- production release: not requested"
          } >> "$GITHUB_STEP_SUMMARY"
