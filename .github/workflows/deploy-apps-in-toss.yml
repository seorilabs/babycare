# AIT(.ait) 빌드 + AppsInToss 비공개 업로드.
#
# 빌드·업로드 본체는 조직 중앙 워크플로에 한 벌만 둔다. 이 파일은 경로와 명령만 넘긴다.
# 러너도 중앙이 고른다(seorilabs-rpi-arm64). 이전에는 "Granite Hermes가 x86-64 전용"이라는
# 전제로 GitHub-hosted ubuntu를 쓰고 있었지만, 같은 Granite/Hermes 스택의 crossword-puzzle이
# 중앙 워크플로로 ARM64 ARC 러너에서 .ait 빌드·업로드에 성공한다(run 31953915642).
name: Deploy AppsInToss

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "업로드할 릴리즈 태그. 비우면 호출 ref."
        type: string
        required: false
        default: ""
      memo:
        description: "업로드 메모(선택)"
        type: string
        required: false
        default: ""
      upload:
        description: "false면 .ait 만 만들고 AppsInToss 업로드는 하지 않는다"
        type: boolean
        required: false
        default: true
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: false
        default: ""
      memo:
        type: string
        required: false
        default: ""
      upload:
        type: boolean
        required: false
        default: true
    secrets:
      APPS_IN_TOSS_API_KEY:
        required: true

permissions:
  contents: read
  packages: read

concurrency:
  group: babycare-apps-in-toss-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    uses: seorilabs/.github/.github/workflows/rn-deploy-ait.yml@700348a9511b5ea202291ee1e1de4f73335783e0
    secrets:
      APPS_IN_TOSS_API_KEY: ${{ secrets.APPS_IN_TOSS_API_KEY }}
    with:
      release_tag: ${{ inputs.release_tag }}
      memo: ${{ inputs.memo }}
      # 기본값 true 라 기존 동작은 그대로다. false 로 부르면 업로드 없이 빌드와
      # artifact 검증까지만 해서 전환 결과를 실제로 확인할 수 있다.
      upload: ${{ inputs.upload }}
      ait_dir: apps/ait
      package_manager: pnpm
      node_version: "24.16.0"
      pnpm_version: "11.14.0"
      install_command: pnpm install --frozen-lockfile
      # 이 앱은 Firebase 웹 키를 FIREBASE_WEB_API_KEY 이름으로 번들에 인라인한다
      # (apps/ait/babel.config.js의 INLINED_ENV_KEYS, granite.config.ts의 esbuild define).
      # 중앙은 조직 표준 이름 VITE_FIREBASE_API_KEY로 job env에 넣어 주므로 여기서 잇는다.
      # 앱 쪽 이름을 바꾸지 않는 이유는 개발자 로컬 apps/ait/.env가 gitignore라
      # 이름을 바꾸면 로컬 dev 번들이 빈 키로 조용히 깨지기 때문이다.
      build_command: |
        ad_group="${{ vars.AIT_REWARDED_AD_GROUP_ID }}"
        if [ -z "${ad_group//[[:space:]]/}" ]; then
          echo "::error::AIT_REWARDED_AD_GROUP_ID repository variable is required."
          exit 1
        fi
        if [ -z "${VITE_FIREBASE_API_KEY//[[:space:]]/}" ]; then
          echo "::error::FIREBASE_API_KEY repository variable is required."
          exit 1
        fi
        export AIT_REWARDED_AD_GROUP_ID="$ad_group"
        export FIREBASE_WEB_API_KEY="$VITE_FIREBASE_API_KEY"
        export APP_VERSION="${{ inputs.release_tag || github.ref_name }}"
        pnpm --dir apps/ait build
      artifact_path: apps/ait/babynest.ait
