# Deploy All — 릴리즈 태그 1개를 해석해 AIT/GPS/APS 를 한 번에 배포.
# 보통 Backoffice/Telegram에서 트리거. 마켓별 toggle 가능.
name: Deploy All

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "배포할 SemVer 태그. 비우면 최신 vX.Y.Z."
        type: string
        required: false
        default: ""
      deploy_ait:
        type: boolean
        default: true
      deploy_google_play:
        type: boolean
        default: true
      deploy_app_store:
        description: "App Store 포함(ios_* 입력 필요)"
        type: boolean
        default: false
      track:
        description: "Google Play track"
        type: choice
        options: [internal, production]
        default: internal
      release_status:
        description: "Google Play release status"
        type: choice
        options: [draft, completed]
        default: completed
      ios_scheme:
        description: "App Store: Xcode scheme"
        type: string
        required: false
        default: "BabyCare"
      ios_workspace:
        description: "App Store: Xcode workspace 경로"
        type: string
        required: false
        default: "apps/mobile/ios/BabyCare.xcworkspace"
      ios_bundle_id:
        description: "App Store: iOS bundle id"
        type: string
        required: false
        default: "com.seorilabs.babycare"
      memo:
        description: "AIT 배포 메모(선택)"
        type: string
        required: false
        default: ""

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-all-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve release tag
    uses: seorilabs/.github/.github/workflows/resolve-release-version.yml@8a11a145fed35479a4a89ebc7ca97edd0a0f05fd
    with:
      release_tag: ${{ inputs.release_tag }}

  ait:
    name: Deploy AIT
    needs: resolve
    if: ${{ inputs.deploy_ait }}
    uses: ./.github/workflows/deploy-apps-in-toss.yml
    secrets:
      APPS_IN_TOSS_API_KEY: ${{ secrets.APPS_IN_TOSS_API_KEY }}
      FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
    with:
      release_tag: ${{ needs.resolve.outputs.tag }}
      memo: ${{ inputs.memo }}

  google-play:
    name: Deploy Google Play
    needs: resolve
    if: ${{ inputs.deploy_google_play }}
    uses: ./.github/workflows/deploy-google-play.yml
    secrets:
      FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
      GOOGLE_PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.GOOGLE_PLAY_UPLOAD_KEYSTORE_BASE64 }}
      GOOGLE_PLAY_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.GOOGLE_PLAY_UPLOAD_KEYSTORE_PASSWORD }}
      GOOGLE_PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.GOOGLE_PLAY_UPLOAD_KEY_PASSWORD }}
    with:
      release_tag: ${{ needs.resolve.outputs.tag }}
      upload: true
      track: ${{ inputs.track }}
      release_status: ${{ inputs.release_status }}

  app-store:
    name: Deploy App Store
    needs: resolve
    if: ${{ inputs.deploy_app_store }}
    uses: ./.github/workflows/deploy-app-store.yml
    secrets:
      APPLE_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
      APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
      APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
      APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
      FIREBASE_IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.FIREBASE_IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
    with:
      release_tag: ${{ needs.resolve.outputs.tag }}
      upload: true
      ios_scheme: ${{ inputs.ios_scheme }}
      ios_workspace: ${{ inputs.ios_workspace }}
      ios_bundle_id: ${{ inputs.ios_bundle_id }}
