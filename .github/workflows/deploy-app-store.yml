# App Store(Xcode archive + 업로드) — macos-26. org 재사용 워크플로우 호출.
#
# ⚠️ babycare App Store 배포 정본은 **Xcode Cloud**다(apps/mobile/ios/ci_scripts/ + backoffice
#    ciBuildRuns 트리거, XCODE_CLOUD_APP_STORE_REPOS allowlist). babycare 는 RNFirebase 라
#    Xcode 26.x 정적 링키지 회귀 대상이라 macOS 러너 archive 는 실패 위험이 있다. 이 GH 경로는
#    fallback 으로만 남긴다(deploy-all 기본 deploy_app_store=false, backoffice ALL 배포도
#    Xcode Cloud repo 면 deploy_app_store=false 주입). 필요 시 수동 dispatch 로만 사용.
#
# ios_scheme/workspace/bundle_id 기본값은 확정된 실제 식별자(2026-07-13). 필요 시 dispatch로 override.
name: Deploy App Store

on:
  workflow_dispatch:
    inputs:
      release_tag:
        type: string
        required: false
        default: ""
      upload:
        description: "true면 App Store Connect 업로드(false면 xcarchive 아티팩트만)"
        type: boolean
        default: false
      ios_scheme:
        description: "Xcode scheme"
        type: string
        default: "BabyCare"
      ios_workspace:
        description: "Xcode workspace 경로(.xcworkspace)"
        type: string
        default: "apps/mobile/ios/BabyCare.xcworkspace"
      ios_bundle_id:
        description: "iOS bundle id"
        type: string
        default: "com.seorilabs.babycare"
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: false
        default: ""
      upload:
        type: boolean
        default: true
      ios_scheme:
        type: string
        default: "BabyCare"
      ios_workspace:
        type: string
        default: "apps/mobile/ios/BabyCare.xcworkspace"
      ios_bundle_id:
        type: string
        default: "com.seorilabs.babycare"

permissions:
  contents: read

jobs:
  app-store:
    uses: seorilabs/.github/.github/workflows/rn-deploy-app-store.yml@main
    secrets: inherit
    with:
      release_tag: ${{ inputs.release_tag }}
      upload: ${{ inputs.upload }}
      ios_scheme: ${{ inputs.ios_scheme }}
      ios_workspace: ${{ inputs.ios_workspace }}
      ios_bundle_id: ${{ inputs.ios_bundle_id }}
      ios_dir: apps/mobile
      package_manager: pnpm
