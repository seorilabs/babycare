buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("com.google.gms:google-services:4.5.0")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

// Google Mobile Ads 25.4.0 declares Kotlin 2.1 as its minimum but publishes
// Kotlin 2.3 metadata. React Native 0.85 pins the 2.1 compiler, so allow only
// the ads bridge module to consume that forward-compatible metadata.
subprojects { subproject ->
    if (subproject.name == "react-native-google-mobile-ads") {
        subproject.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
            kotlinOptions.freeCompilerArgs += ["-Xskip-metadata-version-check"]
        }
    }
}
