# 평시 릴리즈 경로는 중앙 GitHub Actions(rn-deploy-google-play.yml)다. 이 파일은
# Actions 로 갈 수 없을 때 되돌아올 폴백이다.
#
# 자격증명은 Secret Manager 가 아니라 일회성 GCS 객체로 들어온다. 폴백이라 워크플로가
# 올려주지 않고, 되돌릴 때 사람이 로컬 카탈로그에서 직접 올린다. 로컬 원본이
# source of truth 이고 ~/.config/seorilabs 아래에 있다.
#
# 되돌리는 방법:
#   B="gs://seorilabs-ci-build-credentials/seorilabs/babycare/manual-$(date +%s)"
#   C="$HOME/.config/seorilabs"; D="$(mktemp -d)"; umask 077
#   base64 -i "$C/firebase/babycare-google-services.json" | tr -d '\n' > "$D/firebase-android-config.b64"
#   base64 -i "$C/play-store/babycare-upload.jks"         | tr -d '\n' > "$D/play-keystore.b64"
#   grep '^GOOGLE_PLAY_UPLOAD_KEYSTORE_PASSWORD=' "$C/play-store/keystore.env" | cut -d= -f2- | tr -d '\n' > "$D/play-keystore-password"
#   grep '^GOOGLE_PLAY_UPLOAD_KEY_PASSWORD='      "$C/play-store/keystore.env" | cut -d= -f2- | tr -d '\n' > "$D/play-key-password"
#   for f in "$D"/*; do gcloud storage cp "$f" "$B/$(basename "$f")"; done
#   gcloud builds submit . --project=seorilabs-ci --config=cloudbuild-android.yaml \
#     --substitutions="_RELEASE_TAG=v1.2.3,_RELEASE_VERSION_NAME=1.2.3,_RELEASE_VERSION_CODE=...,_ARTIFACT_BUCKET=gs://...,_CREDENTIAL_BUCKET=$B"
#   rm -rf "$D"
#
# 입력은 scripts/build-android.sh 의 market-upload 계약을 그대로 따른다. 2026-09-01(#92, #94)에
# 스크립트가 SEORI_RELEASE_* 를 요구하고 ANDROID_VERSION_* 를 거부하도록 바뀌었는데 이 파일이
# 따라가지 않아 폴백이 첫 검사에서 멈추는 상태였다. check-build-workflows.test.mjs 가 이제
# 스크립트의 필수·거부 목록을 직접 읽어 이 파일과 대조한다.
#
# babycare 의 keystore companion 은 play-store/keystore.env 다. 앱 이름이 붙지 않은
# 일반 파일명이라 다른 앱 것과 헷갈리기 쉽다. 카탈로그 companionPath 가 정본이다.
#
substitutions:
  # 중앙 릴리즈가 태그에서 파생하는 세 값이다. 스크립트가 태그와 versionName 을 대조한다.
  # 기본값을 비운다. 옛 값이 남아 있으면 틀린 버전으로 조용히 빌드될 수 있다.
  _RELEASE_TAG: ""
  _RELEASE_VERSION_NAME: ""
  _RELEASE_VERSION_CODE: ""
  _GOOGLE_PLAY_UPLOAD_KEY_ALIAS: "upload"
  _ARTIFACT_BUCKET: "gs://seorilabs-ci-babycare-build-artifacts/manual"
  _CREDENTIAL_BUCKET: ""

steps:
  # rm 에 `|| true` 를 붙이지 않는다. prefix 는 제출 직전에 사람이 만든 것이라 반드시
  # 존재하고, 삭제 실패는 키스토어가 GCS 에 남았다는 뜻이다. 빌드 맨 앞 단계라
  # 세워도 긴 AAB 빌드를 낭비하지 않는다.
  - id: fetch-ephemeral-credentials
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        install -d -m 0700 /workspace/.ci-secrets
        for name in \
          firebase-android-config.b64 \
          play-keystore.b64 \
          play-keystore-password \
          play-key-password; do
          gcloud storage cp "${_CREDENTIAL_BUCKET}/$$name" "/workspace/.ci-secrets/$$name"
          chmod 0600 "/workspace/.ci-secrets/$$name"
        done
        gcloud storage rm --recursive "${_CREDENTIAL_BUCKET}"

  # pnpm store 디렉터리를 먼저 만든다. 스크립트는 build.env 의 CLOUD_BUILD_PNPM_STORE 가 없으면
  # 멈추는데, 이 디렉터리는 platform-sdk 가 비공개 패키지였을 때 제출 전에 채우던 흔적이다.
  # 지금은 공개 npm 패키지이고 스크립트의 pnpm install 이 --offline 이 아니라, 빈 디렉터리면
  # 레지스트리에서 받아 채운다.
  - id: build-signed-aab
    name: asia-northeast3-docker.pkg.dev/seorilabs-ci/builders/rn-android-builder:node24-pnpm11.14-jdk21-rn085
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        store="$$(grep '^CLOUD_BUILD_PNPM_STORE=' build.env | cut -d= -f2-)"
        [ -n "$$store" ]
        mkdir -p "/workspace/$$store"
        exec bash scripts/build-android.sh
    env:
      - SEORI_RELEASE_TAG=${_RELEASE_TAG}
      - SEORI_RELEASE_VERSION_NAME=${_RELEASE_VERSION_NAME}
      - SEORI_RELEASE_VERSION_CODE=${_RELEASE_VERSION_CODE}
      - GOOGLE_PLAY_UPLOAD_KEY_ALIAS=${_GOOGLE_PLAY_UPLOAD_KEY_ALIAS}
      - BUILD_CREDENTIAL_DIR=/workspace/.ci-secrets

artifacts:
  objects:
    location: ${_ARTIFACT_BUCKET}
    paths:
      - dist/android/babycare.aab

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

timeout: 2400s
